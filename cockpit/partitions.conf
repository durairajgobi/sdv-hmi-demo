# sdv-hypervisor partition table
# Mirrors the VM configuration of a cockpit domain controller running a
# type-1 hypervisor: one safety-relevant cluster guest, one QM infotainment
# guest, each with dedicated CPUs, a memory ceiling and a health watchdog.
# ${VAR} is expanded from the environment. Boot order = file order.

[cluster]
criticality   = ASIL-B
cpus          = 0                # dedicated core: IVI load cannot steal it
nice          = -10              # higher scheduling priority
memory_mb     = 0                # no ceiling for the safety partition
heartbeat     = cluster          # GUI-thread heartbeat in the cluster region
watchdog_ms   = 1000
boot_grace_ms = 8000
restart       = always
exec          = ${SDV_BIN_DIR}/sdv-cluster-hmi

[ivi]
criticality   = QM
cpus          = 1
nice          = 10
memory_mb     = 1024             # guest RAM ceiling: a leak kills only this VM
heartbeat     = ivi
watchdog_ms   = 1000
boot_grace_ms = 6000
restart       = always
exec          = ${SDV_BIN_DIR}/sdv-ivi-guest
